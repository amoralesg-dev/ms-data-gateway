# ─────────────────────────────────────────────────────────────────────────
# PERFIL: test (Pruebas automatizadas en local y CI/CD GitHub Actions)
# ─────────────────────────────────────────────────────────────────────────
# Se activa con: -Dspring.profiles.active=test
# Utiliza H2 en memoria (modo MySQL) sin requerir conexiones externas.
# ─────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:gateway_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: GatewayCatalogPool-TEST
      connection-test-query: SELECT 1

gateway:
  datasources:
    default-datasource: mysql-gateway
    mysql-gateway:
      type: MYSQL
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:gateway_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password: ""
  security:
    api-keys:
      - test-api-key-001
    admin-keys:
      - test-admin-key-999

qad:
  qxtend:
    endpoint-url: http://localhost:18080/mock-qxtend/services/QdocWebService
    default-domain: TEST_DOM
    default-version: ERP3_1
    default-entity: "0109"
    default-company-code: "0111"
    default-action: SAVE

logging:
  file:
    name: ${LOG_FILE:target/test-logs/ms-data-gateway-test.log}
  logback:
    rollingpolicy:
      file-name-pattern: target/test-logs/archive/ms-data-gateway-test.%d{yyyy-MM-dd}.%i.log.gz
  level:
    root: INFO
    com.gateway: DEBUG
    org.springframework: INFO
